name: Fetch electricity prices

on:
  schedule:
    - cron: '0 14 * * *'   # daily at 14:00 UTC (~16:00 CEST), after day-ahead auction
  workflow_dispatch:        # allows manual trigger from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and validate prices
        run: python src/fetch.py

      - name: Commit and push data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git commit -m "Update prices $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push